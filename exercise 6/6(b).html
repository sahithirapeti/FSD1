<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Output Methods</h2>

<script>
    // 1. document.write()
    document.write("Hello World<br>");

    // 2. alert()
    alert("Welcome to JavaScript");

    // 3. console.log()
    console.log("This is displayed in the console");

    // 4. innerHTML
    document.getElementById("demo").innerHTML = "Hello using innerHTML";
</script>

<p id="demo"></p>

</body>
</html>
