<!DOCTYPE html>
<html>
<head>
    <title>Document Object</title>
</head>
<body>

<h2 id="heading">Document Object</h2>

<script>
    // Property
    document.title = "Document Example";

    // Method
    document.write("Hello from Document Object<br>");

    // getElementById() method
    document.getElementById("heading").innerHTML =
        "Document Object Example";

    // URL property
    console.log("Page URL: " + document.URL);
</script>

</body>
</html>
