<!DOCTYPE html>
<html>
<head>
    <title>String Object</title>
</head>
<body>

<h2>String Object</h2>

<script>
    let str = "Hello JavaScript";

    // Property
    document.write("String: " + str + "<br>");
    document.write("Length: " + str.length + "<br><br>");

    // Methods
    document.write("Uppercase: " +
                   str.toUpperCase() + "<br>");

    document.write("Lowercase: " +
                   str.toLowerCase() + "<br>");

    document.write("Character at 0: " +
                   str.charAt(0) + "<br>");

    document.write("Index of Java: " +
                   str.indexOf("Java") + "<br>");

    document.write("Substring: " +
                   str.substring(0, 5) + "<br>");

    document.write("Replace: " +
                   str.replace("Hello", "Hi") + "<br>");

    document.write("Contains Java: " +
                   str.includes("Java"));
</script>

</body>
</html>
