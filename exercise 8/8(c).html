<!DOCTYPE html>
<html>
<head>
    <title>Loops</title>
</head>
<body>

<h2>For Loop</h2>

<script>
    // For loop
    for (let i = 1; i <= 10; i++) {
        document.write(i + " ");
    }

    document.write("<br><br>");

    // While loop
    document.write("<h2>While Loop</h2>");

    let j = 1;

    while (j <= 10) {
        document.write(j + " ");
        j++;
    }

    document.write("<br><br>");

    // Do-while loop
    document.write("<h2>Do-While Loop</h2>");

    let k = 1;

    do {
        document.write(k + " ");
        k++;
    } while (k <= 10);
</script>

</body>
</html>
