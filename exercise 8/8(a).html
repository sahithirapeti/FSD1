<!DOCTYPE html>
<html>
<head>
    <title>Largest of Three Numbers</title>
</head>
<body>

<h2>Largest of Three Numbers</h2>

<script>
    let a = Number(prompt("Enter first integer:"));
    let b = Number(prompt("Enter second integer:"));
    let c = Number(prompt("Enter third integer:"));

    if (a === b && b === c) {
        alert("All three numbers are equal");
    }
    else if (a === b && a > c) {
        alert("First and second numbers are equal and largest");
    }
    else if (a === c && a > b) {
        alert("First and third numbers are equal and largest");
    }
    else if (b === c && b > a) {
        alert("Second and third numbers are equal and largest");
    }
    else if (a > b && a > c) {
        alert("Largest number is: " + a);
    }
    else if (b > a && b > c) {
        alert("Largest number is: " + b);
    }
    else {
        alert("Largest number is: " + c);
    }
</script>

</body>
</html>
