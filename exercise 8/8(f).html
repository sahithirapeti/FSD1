<!DOCTYPE html>
<html>
<head>
    <title>Denomination Breakdown</title>
</head>
<body>

<h2>Denomination Breakdown</h2>

<script>
    let amount = Number(prompt("Enter deposit amount:"));

    let originalAmount = amount;

    let n100 = Math.floor(amount / 100);
    amount = amount % 100;

    let n50 = Math.floor(amount / 50);
    amount = amount % 50;

    let n20 = Math.floor(amount / 20);
    amount = amount % 20;

    let n10 = Math.floor(amount / 10);
    amount = amount % 10;

    let n5 = Math.floor(amount / 5);
    amount = amount % 5;

    let n1 = amount;

    document.write("<h3>Deposit Amount: ₹" +
                   originalAmount + "</h3>");

    document.write("₹100 notes: " + n100 + "<br>");
    document.write("₹50 notes: " + n50 + "<br>");
    document.write("₹20 notes: " + n20 + "<br>");
    document.write("₹10 notes: " + n10 + "<br>");
    document.write("₹5 coins/notes: " + n5 + "<br>");
    document.write("₹1 coins: " + n1 + "<br>");
</script>

</body>
</html>
